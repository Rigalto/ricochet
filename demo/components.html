<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricochet — components</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; color: var(--rc-text-strong); }
    .bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    .schemes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 34rem), 1fr)); gap: 1rem; }
    .scheme { padding: 1rem; border-radius: 10px; display: grid; gap: .75rem; }
    .scheme > h2 { margin: 0; font-size: 1rem; color: var(--rc-text-strong); }
    .block { padding: .75rem; border-radius: 8px; border: 1px solid var(--rc-border); display: grid; gap: .5rem; }
    .block > .title { color: var(--rc-text-muted); font-size: .85rem; }
    .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    /* a palette of the application, for the actions that stand out: it sets two tokens directly */
    [palette="action"] {
      --rc-hue: 225;
      --rc-surface: light-dark(oklch(48% .12 235), oklch(42% .1 235));
      --rc-text: oklch(98% .01 235);
    }
    .w6 { width: 6em; } .w8 { width: 8em; } .w10 { width: 10em; } .w12 { width: 12em; } .wide { width: 100%; }
    #log, #timing { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--rc-text-muted); min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Ricochet — rc-icon, rc-icon-button, rc-text-button, rc-checkbox, rc-radio, rc-input and rc-textarea</h1>
  <div class="bar">
    <span>Theme of the page:</span>
    <rc-icon-button icon="computerclassic" data-item="ricochet-theme" data-value="system">system</rc-icon-button>
    <rc-icon-button icon="sunglasses" data-item="ricochet-theme" data-value="day">day</rc-icon-button>
    <rc-icon-button icon="moonfirstquarter" data-item="ricochet-theme" data-value="night">night</rc-icon-button>
    <span id="log">Use a button, a checkbox, a radio or a field: its event is shown here.</span>
  </div>
  <div class="bar">
    <rc-icon-button icon="sync" data-event="demoRemount" title="Mount every block again, and measure">Mount again</rc-icon-button>
    <span id="timing"></span>
  </div>
  <div class="schemes" id="schemes"></div>

  <script type="module">
    import {WComponent} from '../src/core/w-component.mjs'
    import {config} from '../src/core/config.mjs'
    import {MemoryAdapter} from '../src/adapters/memory.mjs'
    import {WController} from '../src/core/w-controller.mjs'
    import '../src/ui/theme.mjs'
    import '../src/ui/rc-icon-button.mjs'
    import '../src/ui/rc-text-button.mjs'
    import '../src/ui/rc-checkbox.mjs'
    import '../src/ui/rc-radio.mjs'
    import {defineChecks} from '../src/ui/rc-input.mjs'
    import '../src/ui/rc-textarea.mjs'

    const block = (palette, shade) => `
      <div class="block" palette="${palette}" shade="${shade}">
        <div class="title">palette="${palette}" shade="${shade}"</div>
        <div class="row">
          <rc-icon icon="save"></rc-icon><rc-icon icon="trash" size="32"></rc-icon><rc-icon icon="unknownicon" size="16"></rc-icon>
        </div>
        <div class="row">
          <rc-icon-button icon="save" data-event="demoClick" data-param='{"button": "save"}'>Save</rc-icon-button>
          <rc-icon-button icon="trash" data-event="demoClick" data-param='{"button": "delete"}' title="Delete"></rc-icon-button>
          <rc-icon-button icon="pen" flat data-event="demoClick" data-param='{"button": "flat"}'>Flat</rc-icon-button>
          <rc-icon-button icon="lock" disabled data-event="demoClick" data-param='{"button": "disabled"}'>Disabled</rc-icon-button>
          <rc-icon-button icon="star" class="rc-shadow-2" data-event="demoClick" data-param='{"button": "shadow"}'>Shadow</rc-icon-button>
          <rc-icon-button icon="bold" class="rc-text-shadow" data-event="demoClick" data-param='{"button": "text shadow"}'>Text shadow</rc-icon-button>
        </div>
        <div class="row">
          <rc-text-button data-event="demoClick" data-param='{"button": "text"}'>Text button</rc-text-button>
          <rc-text-button flat data-event="demoClick" data-param='{"button": "breadcrumb"}'>Home</rc-text-button>›
          <rc-text-button flat data-event="demoClick" data-param='{"button": "breadcrumb"}'>Books</rc-text-button>
          <rc-text-button link data-event="demoClick" data-param='{"button": "link"}'>A link</rc-text-button>
          <rc-text-button palette="action" class="rc-shadow-2 rc-text-shadow" data-event="demoClick"
            data-param='{"button": "action"}'>Action <rc-icon icon="save" size="18"></rc-icon></rc-text-button>
          <rc-text-button disabled data-event="demoClick" data-param='{"button": "disabled"}'>Disabled</rc-text-button>
        </div>
        <div class="row">
          <rc-checkbox data-item="demo-grid">Grid (item, shared by every block)</rc-checkbox>
          <rc-checkbox checked data-event="demoCheck" data-param='{"box": "roads"}'>Roads</rc-checkbox>
          <rc-checkbox data-event="demoCheck" data-param='{"box": "no label"}' title="No label"></rc-checkbox>
          <rc-checkbox checked disabled>Disabled</rc-checkbox>
        </div>
        <rc-radio-group data-item="demo-size" value="medium">
          <rc-radio value="small">Small (item, shared)</rc-radio>
          <rc-radio value="medium">Medium</rc-radio>
          <rc-radio value="large">Large</rc-radio>
          <rc-radio value="huge" disabled>Huge</rc-radio>
        </rc-radio-group>
        <rc-radio-group data-event="demoRadio" data-param='{"group": "layer"}' value="roads" disabled>
          <rc-radio value="roads">Roads</rc-radio>
          <rc-radio value="rivers">Rivers (disabled group)</rc-radio>
        </rc-radio-group>
        <div class="row">
          <rc-input data-item="demo-name" placeholder="Name (item, shared)" class="w10"></rc-input>
          <rc-input value="12" required min="8" max="64" check="even" placeholder="Even, 8 to 64" class="w8"
            data-event="demoInput" data-param='{"field": "width"}'></rc-input>
          <rc-input type="search" commit="enter" placeholder="Search, then Enter" class="w12"
            data-event="demoInput" data-param='{"field": "search"}'></rc-input>
          <rc-input value="locked" disabled class="w6"></rc-input>
        </div>
        <rc-textarea data-item="demo-note" max-rows="6" class="wide"
          placeholder="A note (item, shared): the field grows with its text, up to 6 lines"></rc-textarea>
      </div>`
    const column = scheme => `
      <section class="scheme" scheme="${scheme}">
        <h2>scheme="${scheme}"</h2>
        ${block('header', 'light')}${block('view', 'light')}${block('view', 'deep')}${block('module', 'medium')}
      </section>`
    const elSchemes = document.getElementById('schemes')
    elSchemes.innerHTML = column('day') + column('night')

    // a named check of the application, used by check="even"
    defineChecks({even: value => Number(value) % 2 === 0})

    config.setAdapter(new MemoryAdapter({'ricochet-theme': 'system'}))
    await config.load()

    // mounting time: every component is mounted synchronously, by render() the first time, then as soon as its element
    // is inserted; the components removed by "Mount again" are detached later, at the end of the task
    const mounted = () => [...elSchemes.querySelectorAll('*')].filter(element => element._component !== undefined).length
    const show = (what, start, end) => {
      const n = mounted()
      document.getElementById('timing').textContent =
        `${what}: ${n} components in ${(end - start).toFixed(1)} ms (${(1000 * (end - start) / n).toFixed(0)} µs each)`
      return n
    }
    const start = performance.now()
    WComponent.render() // opens the mounting of the custom elements (start() does it in an application)
    const end = performance.now()
    show('First mount', start, end)
    requestAnimationFrame(() => {
      const frame = performance.now()
      document.getElementById('timing').textContent += ` · first frame ${(frame - start).toFixed(1)} ms after the start of the mount`
    })

    // the page listens to the events of the components as an application does: a controller and named methods
    class DemoLog extends WController {
      constructor () {
        super()
        this.count = 0
        this.listen(['demoClick', 'demoCheck', 'demoRadio', 'demoInput', 'demoRemount'])
      }

      demoClickDispatched ({button}) { this.#log(`demoClick: ${button}`) }
      demoCheckDispatched ({box, value}) { this.#log(`demoCheck: ${box} = ${value}`) }
      demoRadioDispatched ({group, value}) { this.#log(`demoRadio: ${group} = ${value}`) }
      demoInputDispatched ({field, value}) { this.#log(`demoInput: ${field} = ${value}`) }

      demoRemountDispatched () {
        const start = performance.now()
        elSchemes.innerHTML = column('day') + column('night')
        show('Mount again', start, performance.now())
      }

      #log (text) { document.getElementById('log').textContent = `#${++this.count} ${text}` }
    }
    new DemoLog()
  </script>
</body>
</html>
